<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comissão de Afastamentos - Departamento de Administração</title>
<style>
  :root{
    /* superfícies e tinta */
    --paper:#f7f9fc; --surface:#ffffff;
    --ink:#14213a; --ink2:#3a4358; --muted:#6b7488;
    --line:#dfe5ee; --line2:#eef2f7; --field:#c9d2e2;
    /* destaque único */
    --accent:#12326B; --accent-soft:#E4EBF7; --accent-deep:#0A2149;
    --header:#0B1F3F; --header-text:#eef3fa; --nav-off:#b7c3d8;
    /* estado: só em etiqueta, selo ou faixa de aviso */
    --ok:#3f7d52; --ok-bg:#e8f1e9; --done:#2f6440; --done-bg:#dce9e0;
    --warn:#9a6a12; --warn-bg:#f8efdd; --bad:#a8392a; --bad-bg:#f7e5e1;
    --info:#45526b; --info-bg:#ebeef4; --off-bg:#eef2f7;
    --wrap:1040px; --ring:0 0 0 3px rgba(18,50,107,.14);
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--paper);color:var(--ink);font-size:17px;line-height:1.5;
    font-family:-apple-system,"Segoe UI",system-ui,Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  a{color:var(--accent)} a:hover{color:var(--accent-deep)}
  input,select,textarea,button{font-family:inherit}
  button{cursor:pointer}
  [hidden]{display:none !important}

  /* ---------- cabeçalho ---------- */
  .hdr{background:var(--header)}
  .hdrin{max-width:var(--wrap);margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:12px;background:0;border:0;padding:0;color:inherit}
  .seal{width:38px;height:38px;border-radius:9px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;
    font-family:Georgia,"Times New Roman",serif;font-size:21px;line-height:1;flex:none}
  .brand b{color:var(--header-text);font-size:17px;font-weight:600}
  .nav{margin-left:auto;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .nav .pill{background:transparent;border:0;color:var(--nav-off);font-size:16px;font-weight:600;padding:9px 16px;border-radius:999px}
  .nav .pill.on{background:rgba(255,255,255,.16);color:#fff}
  .nav .out{background:transparent;border:1px solid rgba(255,255,255,.28);color:#fff;font-size:15px;font-weight:600;padding:9px 16px;border-radius:10px;margin-left:8px}

  /* ---------- página ---------- */
  main{max-width:var(--wrap);margin:0 auto;padding:44px 24px 80px;display:flex;flex-direction:column;gap:28px}
  .h1{font-size:32px;font-weight:620;letter-spacing:-.7px;margin:0;line-height:1.2}
  .h1.big{font-size:34px;letter-spacing:-.8px}
  .lead{font-size:16px;color:var(--muted);margin:6px 0 0}
  .col{display:flex;flex-direction:column;gap:22px}
  .narrow{max-width:760px;width:100%}
  .center{align-self:center;width:100%}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px 32px}
  .card.sm{border-radius:16px;padding:20px 24px}
  .grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
  .grid .full{grid-column:1/-1}
  .muted{color:var(--muted)}
  .small{font-size:15px}
  .foot{max-width:var(--wrap);margin:0 auto;padding:0 24px 40px;display:flex;gap:18px;flex-wrap:wrap;font-size:15px}
  .foot button{background:0;border:0;padding:0;color:var(--muted);font-size:15px;text-decoration:underline}

  /* ---------- botões ---------- */
  .btn{font-size:17px;font-weight:600;padding:14px 26px;border-radius:10px;background:var(--accent);color:#fff;border:1px solid var(--accent);line-height:1.2}
  .btn:hover{background:var(--accent-deep)}
  .btn.sec{background:#fff;color:var(--ink2);border-color:var(--line)}
  .btn.sec:hover{border-color:var(--field);color:var(--ink)}
  .btn.sm{font-size:16px;padding:12px 22px}
  .btn:disabled{opacity:.6;cursor:default}
  .linkbtn{background:0;border:0;padding:0;color:var(--accent);font-size:16px;font-weight:600;align-self:flex-start}
  .acts{display:flex;gap:12px;flex-wrap:wrap}
  .acts.split{justify-content:space-between;padding-top:20px;border-top:1px solid var(--line2)}

  /* ---------- formulário ---------- */
  .fld{display:flex;flex-direction:column;gap:8px}
  .fld>span,.lbl{font-size:16px;font-weight:600}
  input,textarea,select{padding:14px 16px;font-size:17px;border:1px solid var(--field);border-radius:10px;color:var(--ink);background:#fff;width:100%}
  input[type=date]{padding:13px 16px}
  textarea{resize:vertical}
  input:focus,textarea:focus,select:focus{outline:0;border-color:var(--accent);box-shadow:var(--ring)}
  .chips{display:flex;gap:10px;flex-wrap:wrap}
  .chip{font-size:16px;font-weight:600;padding:12px 18px;border-radius:12px;background:#fff;color:var(--ink2);border:1px solid var(--line)}
  .chip.lg{font-size:17px;padding:14px 22px}
  .chip[aria-pressed=true]{background:var(--accent);color:#fff;border-color:var(--accent)}
  .chip:focus-visible,.btn:focus-visible,.pill:focus-visible{outline:0;box-shadow:var(--ring)}
  .bars{display:grid;gap:10px}
  .bars>div{display:flex;flex-direction:column;gap:8px}
  .bars i{height:8px;border-radius:999px;background:var(--line)}
  .bars i.on{background:var(--accent)}
  .bars b{font-size:15px;font-weight:600;color:var(--muted)}
  .bars b.on{color:var(--ink)}
  .drop{position:relative;border:1.5px dashed var(--field);border-radius:14px;padding:20px;display:flex;gap:14px;align-items:center;background:#fff;cursor:pointer}
  .drop.ok{background:var(--ok-bg)}
  .drop input{position:absolute;inset:0;opacity:0;cursor:pointer;padding:0}
  .drop .ic{width:42px;height:42px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
  .drop .tx{display:flex;flex-direction:column;gap:2px;min-width:0}
  .drop .tx span{font-size:15px;color:var(--muted);overflow-wrap:anywhere}
  .msg{font-size:16px;font-weight:600;padding:12px 16px;border-radius:10px}
  .msg.bad{background:var(--bad-bg);color:var(--bad)}
  .msg.warn{background:var(--warn-bg);color:var(--warn)}
  .msg.info{background:var(--paper);color:var(--ink2);font-weight:400;display:flex;gap:14px;align-items:center}

  /* ---------- início ---------- */
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
  .tile{background:#fff;border:1px solid var(--line);border-radius:18px;padding:32px;display:flex;flex-direction:column;gap:10px;text-align:left;color:var(--ink)}
  .tile b{font-size:23px;font-weight:620}
  .tile span{font-size:16px;color:var(--muted)}
  .tile.main{background:var(--accent);border-color:var(--accent);color:#fff}
  .tile.main span{color:#c9d6ec}
  .tile:hover{border-color:var(--field)} .tile.main:hover{background:var(--accent-deep)}
  .steps4{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:18px}
  .steps4>div{display:flex;flex-direction:column;gap:6px}
  .num{width:34px;height:34px;border-radius:999px;background:var(--accent-soft);color:var(--accent-deep);font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
  .steps4 b{font-size:16px} .steps4 span{font-size:15px;color:var(--muted)}

  /* ---------- listas ---------- */
  .list{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
  .item{display:flex;align-items:center;gap:18px;padding:18px 24px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
  .item:last-child{border-bottom:0}
  .item .pos{width:38px;height:38px;border-radius:999px;background:var(--accent-soft);color:var(--accent-deep);font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;flex:none}
  .who{display:flex;flex-direction:column;gap:2px;flex:1;min-width:180px}
  .who b{font-size:18px;font-weight:620}
  .who span{font-size:15px;color:var(--muted)}
  .tag{font-size:15px;font-weight:600;padding:6px 14px;border-radius:999px;white-space:nowrap}
  .pcard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px 24px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .pcard .who b{font-size:19px}
  .ghead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  .ghead b{font-size:22px;font-weight:620}
  .ghead span{font-size:16px;font-weight:600}
  .empty{text-align:center;padding:48px;font-size:17px;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:16px}
  .filters{display:flex;gap:8px;flex-wrap:wrap}
  .filters .chip{border-radius:999px;padding:10px 18px}
  .topline{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}

  /* ---------- detalhe, vagas ---------- */
  .data{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}
  .data>div{display:flex;flex-direction:column;gap:4px}
  .data em{font-style:normal;font-size:14px;font-weight:600;color:var(--muted)}
  .data .falta{color:var(--bad);font-weight:600}
  .ask{display:flex;flex-direction:column;gap:14px;padding-top:20px;border-top:1px solid var(--line2)}
  .ask>b{font-size:19px;font-weight:620}
  .vgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
  .vcard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:14px}
  .vcard .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .vcard .top b{font-size:22px}
  .vbars{display:flex;gap:6px}
  .vbars i{flex:1;height:10px;border-radius:999px;background:var(--line)}
  .vbars i.on{background:var(--accent)}
  details.more{border-top:1px solid var(--line2);padding-top:16px}
  details.more summary{font-size:16px;font-weight:600;color:var(--accent);cursor:pointer}
  .ok-ic{width:56px;height:56px;border-radius:999px;background:var(--ok-bg);color:var(--ok);display:flex;align-items:center;justify-content:center}
  .lock-ic{width:48px;height:48px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center}
  .gbtn{display:flex;align-items:center;justify-content:center;gap:12px;font-size:17px;font-weight:600;padding:15px 24px;border-radius:10px;background:#fff;border:1px solid var(--field);color:var(--ink)}

  /* ---------- tabelas (histórico) ---------- */
  .tbl{width:100%;border-collapse:collapse;font-size:15px}
  .tbl th{text-align:left;font-size:14px;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line)}
  .tbl td{padding:10px 12px;border-bottom:1px solid var(--line2);vertical-align:top}
  .scroll{overflow-x:auto}
  .rule{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--line2)}
  .rule:last-child{border-bottom:0}
  .rule b{display:block;font-size:17px}
  .rule p{margin:4px 0 0;font-size:16px;color:var(--ink2)}

  @media (max-width:600px){
    main{padding:28px 16px 64px}
    .hdrin{padding:12px 16px}
    .card{padding:22px 18px}
    .item,.pcard{padding:16px}
    .h1{font-size:28px} .h1.big{font-size:30px}
    .bars b{font-size:14px}
  }
</style>
</head>
<body>

<header class="hdr">
  <div class="hdrin">
    <button class="brand" onclick="irInicio()" aria-label="Início"><span class="seal">A</span><b>Comissão de Afastamentos</b></button>
    <div class="nav" id="nav"></div>
  </div>
</header>

<main id="tela"></main>
<div class="foot" id="rodape"></div>

<script>
/* ================= API ================= */
const ENDPOINT='/api/app';
const EMAIL_COPIA='afastamento.adm@facc.ufrj.br';
let TOKEN=localStorage.getItem('af:token')||'';
let DEP=localStorage.getItem('af:dep')||'';
let EU=null; try{EU=JSON.parse(localStorage.getItem('af:usuario')||'null');}catch(e){}
function cabecalhos(){
  const h={'Content-Type':'application/json'};
  if(TOKEN)h.Authorization='Bearer '+TOKEN;
  if(DEP)h['X-Acesso']=DEP;
  return h;
}
async function api(acao,dados){
  const r=await fetch(ENDPOINT,{method:'POST',headers:cabecalhos(),body:JSON.stringify(Object.assign({acao},dados||{}))});
  let j={};try{j=await r.json();}catch(e){}
  if(r.status===401&&acao!=='login'&&acao!=='loginGoogle'&&TOKEN){sessaoExpirou();throw new Error(j.erro||'Sessão expirada. Entre novamente.');}
  if(!r.ok)throw new Error(j.erro||('Erro '+r.status));
  return j;
}
function sessaoExpirou(){
  TOKEN='';EU=null;localStorage.removeItem('af:token');localStorage.removeItem('af:usuario');
  DADOS={registros:[],config:{},auditoria:[],usuarios:[]};
  if(COMISSAO.includes(S.tela))mostrar('entrar');
}

/* ================= Estado ================= */
const MAX_ARQ=3*1024*1024;
const CLASSES={'Auxiliar':1,'Assistente':2,'Adjunto':3,'Associado':4,'Titular':5};
const AREAS_PADRAO=['Finanças','Marketing','Estratégia','Operações','Contabilidade','Gestão de Pessoas','Outra'];
const SUGESTOES=[{nome:'Laura Valencia',login:'laura.valencia@facc.ufrj.br'},{nome:'Vanessa Brulon',login:'vanessabrulon@facc.ufrj.br'},{nome:'Camila Avosani',login:'camila.avosani@facc.ufrj.br'}];
const COMISSAO=['pedidos','detalhe','vagas','afastados','config'];
// Situação mostrada na tela, derivada do status gravado no banco.
const SIT={
  docs:{t:'Falta documento',bg:'var(--bad-bg)',fg:'var(--bad)',etapa:1,botao:'Ver'},
  analise:{t:'Esperando parecer',bg:'var(--warn-bg)',fg:'var(--warn)',etapa:2,botao:'Dar parecer'},
  reuniao:{t:'Vai para a reunião',bg:'var(--info-bg)',fg:'var(--info)',etapa:3,botao:'Registrar reunião'},
  aprovado:{t:'Aprovado',bg:'var(--ok-bg)',fg:'var(--ok)',etapa:4,botao:'Ver'},
  afastado:{t:'Afastado',bg:'var(--done-bg)',fg:'var(--done)',etapa:5,botao:'Ver'},
  negado:{t:'Não aprovado',bg:'var(--off-bg)',fg:'var(--muted)',etapa:0,botao:'Ver'}
};
const ETAPAS=['Pedido enviado','Documentos','Parecer da comissão','Reunião de professores','Afastado'];
const ENCERRADOS=['afastado','negado'];

let ESTADO={configurado:false,protegido:false,liberado:false,areas:null,emailComissao:'',googleClientId:''};
let PUB=null;                                              // fila pública (dados reduzidos)
let DADOS={registros:[],config:{},auditoria:[],usuarios:[]}; // área da comissão (dados completos)
let S={tela:'inicio',passo:1,erro:'',filtro:'and',selId:null,ult:null,senha:false,indisponivel:''};
let F=null, ARQ={plano:null,carta:null};

const $=id=>document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function erro(e){alert(e&&e.message?e.message:String(e));}
function topo(){window.scrollTo(0,0);}

/* ================= Regras de negócio ================= */
function filaDe(tipo){return String(tipo).startsWith('Capacitação')?'capac':'dout_pos';}
function carreiraVal(r){return (CLASSES[r.classe]||0)*10+(+r.nivel||0);}
function perIdx(p){const a=String(p).split('.');return (+a[0])*2+((+a[1]||1)-1);}
function perLabelDe(i){return Math.floor(i/2)+'.'+((i%2)+1);}
function perDeData(d){if(!d)return null;const dt=new Date(d+'T00:00');return dt.getFullYear()+'.'+(dt.getMonth()+1<=7?'1':'2');}
function periodoAtual(){return perDeData(new Date().toISOString().slice(0,10));}
function proximos(n,desde){const a=perIdx(desde);return Array.from({length:n},(_,i)=>perLabelDe(a+i));}
function perTexto(r){return (r.periodoFim&&r.periodoFim!==r.periodo)?(r.periodo+' a '+r.periodoFim):r.periodo;}
function periodosDe(r){const a=perIdx(r.periodo),b=perIdx(r.periodoFim||r.periodo);const out=[];for(let i=a;i<=Math.max(a,b);i++)out.push(perLabelDe(i));return out;}
function ocupa(r,p){return periodosDe(r).includes(p);}
// Capacitação no recesso universitário fica fora do limite de 2 por período.
function contaLimite(r){return !(r.fila==='capac'&&r.recesso==='sim');}
function mesesAte(d){if(!d)return null;const h=new Date(),i=new Date(d+'T00:00');return (i.getFullYear()-h.getFullYear())*12+(i.getMonth()-h.getMonth());}
function tetoConfig(){const c=DADOS.config||{};const q=+c.quadro||30,p=+c.pct||0;return{quadro:q,pct:p,teto:p>0?Math.floor(q*p/100):Infinity};}
function limite(){return Math.min(2,tetoConfig().teto);}
function temDocs(r){if(r.docs)return !!(r.docs.plano&&r.docs.carta);return !!r.docOk;}
function situacao(r){
  switch(r.status){
    case 'concluido':return 'afastado';
    case 'desfavoravel':case 'negado_reuniao':return 'negado';
    case 'aprovado_reuniao':return 'aprovado';
    case 'favoravel':return 'reuniao';
    case 'em_analise':return 'analise';
    case 'doc_pendente':return 'docs';
    default:return temDocs(r)?'analise':'docs';
  }
}
function tag(r){const s=SIT[situacao(r)];return `<span class="tag" style="background:${s.bg};color:${s.fg}">${s.t}</span>`;}
function ordemFila(a,b){return String(a.tsFila||a.ts).localeCompare(String(b.tsFila||b.ts));}
function ativos(regs){return regs.filter(r=>situacao(r)!=='negado');}
function posicao(regs,r){return ativos(regs).filter(x=>x.periodo===r.periodo).sort(ordemFila).findIndex(x=>x.id===r.id)+1;}
function vagasDe(regs,p){
  const lim=limite(),ocup=ativos(regs).filter(r=>contaLimite(r)&&ocupa(r,p)),livres=Math.max(0,lim-ocup.length);
  return {ocup,lim,livres,txt:livres===0?'Sem vagas':(livres===1?'1 vaga':livres+' vagas'),cor:livres===0?'var(--warn)':'var(--ok)'};
}
function areasAtuais(){
  const a=(DADOS.config&&DADOS.config.areas)||ESTADO.areas;
  const l=(a&&a.length)?a.slice():AREAS_PADRAO.slice();
  if(!l.includes('Outra'))l.push('Outra');
  return l;
}

/* ================= Navegação ================= */
function logado(){return !!(TOKEN&&EU);}
function mostrar(tela,extra){
  Object.assign(S,{tela,erro:''},extra||{});
  render();topo();
}
function irInicio(){mostrar(logado()?'pedidos':'inicio');}
function irComissao(){
  if(logado()){mostrar('pedidos');if(!DADOS.registros.length)recarregar();}
  else mostrar('entrar');
}
function render(){
  renderNav();
  const v={inicio:vInicio,form:vForm,enviado:vEnviado,fila:vFila,codigo:vCodigo,entrar:vEntrar,setup:vSetup,
    pedidos:vPedidos,detalhe:vDetalhe,vagas:vVagas,afastados:vAfastados,config:vConfig,regras:vRegras}[S.tela]||vInicio;
  $('tela').innerHTML=(S.indisponivel?`<div class="msg bad">Sistema indisponível no momento. ${esc(S.indisponivel)}</div>`:'')+v();
  depoisRender();
}
function renderNav(){
  const com=logado()&&COMISSAO.includes(S.tela);
  const pill=(t,tela,alt)=>`<button class="pill${S.tela===tela||S.tela===alt?' on':''}" onclick="${tela==='fila'?'irFila()':(tela==='inicio'?'irInicio()':`mostrar('${tela}')`)}">${t}</button>`;
  $('nav').innerHTML=com
    ? pill('Pedidos','pedidos','detalhe')+pill('Vagas','vagas')+pill('Afastados','afastados')+`<button class="out" onclick="sair()">Sair</button>`
    : pill('Início','inicio',S.tela==='codigo'&&S.depois==='form'?'codigo':'form')+pill('Fila','fila',S.tela==='codigo'&&S.depois==='form'?'':'codigo')+`<button class="out" onclick="irComissao()">Sou da comissão</button>`;
  $('rodape').innerHTML=com
    ? `<button onclick="mostrar('config')">Configurações</button><span class="muted">Entrou como ${esc(EU.nome)}</span>`
    : `<button onclick="mostrar('regras')">Regras da comissão</button>`;
}
let depoisRender=()=>{};

/* ================= Início ================= */
function vInicio(){
  depoisRender=()=>{};
  return `<div class="col" style="gap:28px">
    <h1 class="h1 big">O que você quer fazer?</h1>
    <div class="tiles">
      <button class="tile main" onclick="irForm()">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        <b>Pedir afastamento</b><span>Leva uns 5 minutos. Não precisa de cadastro.</span>
      </button>
      <button class="tile" onclick="irFila()">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>

function anexo(k,rot,ic){
  const f=ARQ[k];
  return `<label class="drop${f?' ok':''}"><span class="ic">${ic}</span>
    <span class="tx"><b>${rot}</b><span>${f?esc(f.name):'Toque para anexar (PDF ou Word)'}</span></span>
    <input type="file" accept=".pdf,.doc,.docx,.odt,.png,.jpg,.jpeg" onchange="pegarArquivo('${k}',this)" aria-label="${rot}"></label>`;
}
function pegarArquivo(k,inp){
  const f=inp.files&&inp.files[0];
  if(f&&f.size>MAX_ARQ){alert('O arquivo "'+f.name+'" tem '+(f.size/1048576).toFixed(1)+' MB. O limite é 3 MB.');inp.value='';return;}
  ARQ[k]=f||null;render();
}
function lerArquivo(f){
  return new Promise(res=>{
    if(!f){res(null);return;}
    const fr=new FileReader();
    fr.onload=()=>res({nome:f.name,tipo:f.type||'application/octet-stream',dados:String(fr.result).split(',')[1]});
    fr.onerror=()=>res(null);
    fr.readAsDataURL(f);
  });
}
function voltarPasso(){if(S.passo>1)mostrar('form',{passo:S.passo-1});else irInicio();}
function falhou(msg){S.erro=msg;render();}
async function avancar(){
  if(S.passo===1){
    if(!F.nome.trim())return falhou('Escreva seu nome.');
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(F.email.trim()))return falhou('Confira o e-mail.');
    if(!F.area)return falhou('Escolha sua área.');
    if(F.area==='Outra'&&!F.areaOutra.trim())return falhou('Escreva qual é a sua área.');
  }
  if(S.passo===2){
    const d=perIdx(F.fim)-perIdx(F.ini);
    if(d<0)return falhou('O período final não pode vir antes do inicial.');
    if(d>1)return falhou('O afastamento pode ocupar no máximo dois períodos seguidos.');
  }
  if(S.passo<3){mostrar('form',{passo:S.passo+1});return;}
  await enviar();
}
async function enviar(){
  const dur=+F.dur,m=mesesAte(F.inicio);
  if(F.tipo==='Pós-doutorado'&&F.dur&&(dur<6||dur>12)&&!confirm('O pós-doutorado dura de 6 a 12 meses. Você escreveu '+dur+' meses. Enviar assim mesmo?'))return;
  if(m!=null&&m<6&&!confirm('Faltam menos de 6 meses para o início. A regra pede pelo menos 6 meses. Enviar assim mesmo?'))return;
  const bt=$('btAvancar');bt.disabled=true;bt.textContent='Enviando…';
  const arqPlano=await lerArquivo(ARQ.plano), arqCarta=await lerArquivo(ARQ.carta);
  const registro={
    nome:F.nome.trim(),email:F.email.trim(),area:F.area==='Outra'?F.areaOutra.trim():F.area,
    classe:F.classe,nivel:'',ingresso:F.ingresso,numaf:F.numaf||'0',
    tipo:F.tipo,fila:filaDe(F.tipo),recesso:F.tipo==='Capacitação'?F.recesso:'nao',periodo:F.ini,periodoFim:F.fim,
    inicio:F.inicio,dur:F.dur,lic:F.tipo==='Pós-doutorado'?'Afastamento para pós-doutorado':'Licença para capacitação',
    destino:F.destino.trim(),just:F.just.trim(),siape:'',orient:'',disc:'',cob:'',jaPosdoc:'',anoPosdoc:'',
    carta:arqCarta?'sim':'nao',plano:arqPlano?'sim':'nao',
    docs:{periodo:true,duracao:true,licenca:true,plano:false,carta:false}
  };
  try{
    const res=await api('manifestar',{registro});
    const falhas=[];
    for(const [campo,arq] of [['plano',arqPlano],['carta',arqCarta]]){
      if(!arq)continue;
      bt.textContent='Enviando anexo…';
      try{await api('anexar',{id:res.id,campo,email:registro.email,arquivo:arq});registro.docs[campo]=true;}
      catch(e){falhas.push(campo==='plano'?'plano de trabalho':'carta-convite');registro[campo]='nao';}
    }
    copiaEmail(registro);
    const falta=[!registro.docs.plano&&'plano de trabalho',!registro.docs.carta&&'carta-convite'].filter(Boolean);
    let pos=0;
    try{if(ESTADO.liberado||TOKEN){PUB=(await api('fila')).registros||[];pos=posicao(PUB,{id:res.id,periodo:registro.periodo});}}catch(e){}
    F=null;ARQ={plano:null,carta:null};
    mostrar('enviado',{ult:{periodo:registro.periodo,pos,falta,falhas}});
  }catch(e){bt.disabled=false;bt.textContent='Enviar pedido';falhou(e.message);}
}
// Cópia do pedido para a caixa da comissão (FormSubmit). Falha aqui não bloqueia o registro.
function copiaEmail(r){
  const per=perTexto(r);
  fetch('https://formsubmit.co/ajax/'+EMAIL_COPIA,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},
    body:JSON.stringify({_subject:'Pedido de afastamento: '+r.nome+' ('+r.tipo+', '+per+')',_template:'table',_captcha:'false',_replyto:r.email,
      Docente:r.nome,'E-mail':r.email,'Área':r.area,Classe:r.classe,'Ingresso no departamento':r.ingresso,'Afastamentos anteriores':r.numaf,
      Tipo:r.tipo+(r.fila==='capac'?(r.recesso==='sim'?' (no recesso)':' (fora do recesso)'):''),'Período':per,'Início':r.inicio,'Duração (meses)':r.dur,
      Destino:r.destino,'Resumo do plano':r.just,'Plano de trabalho':r.docs.plano?'anexado':'falta','Carta-convite':r.docs.carta?'anexada':'falta'})
  }).catch(()=>{});
}

  depoisRender=()=>{};
  return `<div class="card col center" style="max-width:760px;gap:20px">
    <h1 class="h1" style="font-size:28px">Configuração inicial</h1>

    ${SUGESTOES.map((u,i)=>`<div class="grid" style="gap:12px;padding:16px;border:1px solid var(--line);border-radius:14px">
      <label class="fld"><span>Nome</span><input id="su_nome${i}" value="${esc(u.nome)}"></label>
      <label class="fld"><span>E-mail</span><input id="su_login${i}" value="${esc(u.login)}"></label>
      <label class="fld"><span>Senha inicial (mín. 8)</span><input id="su_senha${i}" type="password"></label></div>`).join('')}
    <div class="acts"><button class="btn" id="btSetup" onclick="fazerSetup()">Criar os acessos</button></div>
  </div>`;
}
async function fazerSetup(){
  const usuarios=[];
  for(let i=0;i<SUGESTOES.length;i++){
    const nome=$('su_nome'+i).value.trim(),login=$('su_login'+i).value.trim(),senha=$('su_senha'+i).value;
    if(!nome&&!login)continue;
    if(senha.length<8){alert('Defina uma senha de pelo menos 8 caracteres para '+(nome||login)+'.');return;}
    usuarios.push({nome,login,senha});
  }
  if(!usuarios.length){alert('Preencha ao menos um acesso.');return;}
  try{await api('setup',{usuarios});ESTADO.configurado=true;alert('Acessos criados. Agora entre.');mostrar('entrar');}catch(e){erro(e);}
}

function selecionado(){return DADOS.registros.find(x=>x.id===S.selId);}
async function salvarCampos(campos){
  const r=selecionado();if(!r)return;
  try{await api('salvar',{id:r.id,campos});await recarregar();}catch(e){erro(e);}
}
async function decidir(acao){
  const r=selecionado();if(!r)return;
  const txt=($('dec_parecer')||{}).value;
  if(acao==='docs')return salvarCampos({status:'em_analise',docs:{periodo:true,duracao:true,licenca:true,plano:true,carta:true}});
  const campos={status:acao};
  if(typeof txt==='string')campos.parecer=txt.trim()||(acao==='favoravel'?'Favorável.':'Desfavorável.');
  if(acao==='favoravel'&&!temDocs(r)&&!confirm('Ainda falta documento. Dar parecer favorável assim mesmo?'))return;
  return salvarCampos(campos);
}
function cobrar(){
  const r=selecionado();if(!r)return;
  const corpo='Olá, '+r.nome.split(' ')[0]+'.\n\nPara a comissão analisar o seu pedido de afastamento ('+r.tipo+', '+perTexto(r)+'), ainda precisamos do plano de trabalho e da carta-convite.\n\nPode responder a este e-mail com os documentos.\n\nComissão de Afastamentos';
  location.href='mailto:'+encodeURIComponent(r.email)+'?cc='+encodeURIComponent(EMAIL_COPIA)+'&subject='+encodeURIComponent('Documentos do pedido de afastamento')+'&body='+encodeURIComponent(corpo);
}
function marcarExcecional(v){salvarCampos({excecional:v});}
async function repactuar(){
  const r=selecionado();if(!r)return;
  const novo=prompt('Novo período de início (ex.: 2028.1):',r.periodo);if(novo===null)return;
  if(!/^\d{4}\.[12]$/.test(novo.trim())){alert('Use o formato ano.semestre, por exemplo 2028.1.');return;}
  const mot=prompt('Motivo da mudança. Digite o número:\n1. Impedimento da universidade (mantém o lugar na fila)\n2. Perdeu prazo ou documento (mantém o lugar na fila)\n3. Desistiu ou adiou por vontade própria (vai para o fim da fila)','');
  const motivo={'1':'inst','2':'prazo','3':'voluntaria'}[String(mot||'').trim()];
  if(!motivo){if(mot!==null)alert('Digite 1, 2 ou 3.');return;}
  const span=perIdx(r.periodoFim||r.periodo)-perIdx(r.periodo);
  try{await api('repactuar',{id:r.id,periodo:novo.trim(),periodoFim:perLabelDe(perIdx(novo.trim())+span),motivo});await recarregar();}catch(e){erro(e);}
}
async function excluir(){
  const r=selecionado();if(!r)return;
  if(!confirm('Excluir o pedido de '+r.nome+'? Fica registrado no histórico e não dá para desfazer.'))return;
  try{await api('excluir',{id:r.id});mostrar('pedidos');await recarregar();}catch(e){erro(e);}
}
async function baixarAnexo(id,campo){
  try{
    const r=await fetch(ENDPOINT,{method:'POST',headers:cabecalhos(),body:JSON.stringify({acao:'baixar',id,campo})});
    if(!r.ok){let j={};try{j=await r.json();}catch(e){}throw new Error(j.erro||('Erro '+r.status));}
    const b=await r.blob(),u=URL.createObjectURL(b);
    window.open(u,'_blank');setTimeout(()=>URL.revokeObjectURL(u),60000);
  }catch(e){erro(e);}
}

function restaurar(){
  const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';
  inp.onchange=()=>{const f=inp.files[0];if(!f)return;const fr=new FileReader();
    fr.onload=async()=>{try{const d=JSON.parse(fr.result);
      if(!d||!Array.isArray(d.registros))throw new Error('Arquivo de backup inválido.');
      if(!confirm('Restaurar '+d.registros.length+' pedido(s)? Os '+DADOS.registros.length+' pedidos atuais serão substituídos para todas as integrantes.'))return;
      await api('restaurar',{registros:d.registros,config:d.config});await recarregar();alert('Backup restaurado.');
    }catch(e){erro(e);}};
    fr.readAsText(f);};
  inp.click();
}
